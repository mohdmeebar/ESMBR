<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background-color: #f4efe3;
        background-image: radial-gradient(rgba(74, 94, 42, 0.09) 3px, transparent 3.5px), radial-gradient(rgba(184, 145, 58, 0.08) 3px, transparent 3.5px);
        background-size: 60px 60px, 60px 60px; background-position: 0 0, 30px 30px; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="items" data-composition-id="items" data-composition-src="compositions/items.html" data-start="4.5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html" data-start="11.5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="whatsapp" data-composition-id="whatsapp" data-composition-src="compositions/whatsapp.html" data-start="19.5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="door" data-composition-id="door" data-composition-src="compositions/door.html" data-start="27.5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="dup" data-composition-id="dup" data-composition-src="compositions/dup.html" data-start="35.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="live" data-composition-id="live" data-composition-src="compositions/live.html" data-start="41.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="47" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
