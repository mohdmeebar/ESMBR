      function qrSVG(seed, size, color) {
        const N = 25, m = size / N, r = mulberry32(seed); let s = "";
        const inF = (i, j) => (i < 8 && j < 8) || (i > N - 9 && j < 8) || (i < 8 && j > N - 9);
