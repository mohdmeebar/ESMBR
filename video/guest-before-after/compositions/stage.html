  <script>
    (function () {

      // ---------- renderer ----------

      const paperMats = paperCanvases.map((cv) => new THREE.MeshStandardMaterial({ map: texOf(cv), roughness: 0.9, side: THREE.DoubleSide }));
      const noteMat = new THREE.MeshStandardMaterial({ map: texOf(noteCanvas), roughness: 0.8, side: THREE.DoubleSide });
      const paperGeo = new THREE.PlaneGeometry(0.78, 1.07), noteGeo = new THREE.PlaneGeometry(0.42, 0.42);
      const PAPERS = 46, rndP = mulberry32(77), papers = [];
      for (let i = 0; i < PAPERS; i++) {

      // ---------- AFTER world (warm, orderly) ----------

      const shape = new THREE.Shape();

      const camBpos = track([[0, [-1.55, 4.1, 4.9]], [3.5, [-1.7, 3.9, 4.6], "sine.inOut"], [13.4, [-1.85, 3.7, 4.4], "sine.inOut"]]);

      function placeCard(c, t) {

      function renderAt(t) {
        t = Math.max(0, Math.min(DUR, t));
        // BEFORE
        const shake = t < 12.45 ? 0.012 : 0;
        const bp = camBpos(t), bt = camBtgt(t);

        for (const p of papers) {
          const tau = t - p.s;
          if (tau <= 0) { p.m.visible = false; continue; }
          p.m.visible = true;
          const u = clamp01(tau / 0.85), eh = ease("power2.out")(u), ev = ease("power2.in")(u), fl = (1 - u) * 0.35;

          if (b > 0) { x += p.wind[0] * b; y += p.wind[1] * b; z += p.wind[2] * b; rx += b * 3; rz += b * 2; }

        }
        // AFTER
        const ap = camApos(t), at = camAtgt(t);
        camA.position.set(ap[0], ap[1], ap[2]); camA.lookAt(at[0], at[1], at[2]);
        cards.forEach((c) => placeCard(c, t));
        // card 4 (front centre) flies into the phone
        const hero = cards[4], fly = clamp01((t - 7.6) / 0.6);
        if (fly > 0) {
          const e = ease("power3.inOut")(fly), pp = phonePos(t);
          hero.m.position.set(lerp(hero.g[0], pp[0], e), lerp(0.02, pp[1] + 0.35, e), lerp(hero.g[1], pp[2] + 0.08, e));
          hero.m.rotation.set(lerp(-Math.PI / 2, -0.32, e), lerp(0, -0.12, e), 0);
          hero.m.scale.setScalar(lerp(CARD_S, 0.12, e));
          const op = 1 - clamp01((t - 8.05) / 0.15);
          hero.mats.forEach((m) => (m.opacity = op));
          hero.m.visible = op > 0.001;
        }
        const pp = phonePos(t);
        phone.visible = t >= 7.15;
        phone.position.set(pp[0], pp[1], pp[2]);
        phone.rotation.set(phoneRx(t), phoneRy(t), 0, "YXZ");
        if (phone.visible) { paintScreen(t); screenTex.needsUpdate = true; }

        // composite: after on the left of the split, before on the right
        const sx = Math.round(split(t));
        renderer.setScissorTest(true);
        renderer.setViewport(0, 0, W, H);
        if (sx > 0) { renderer.setScissor(0, 0, sx, H); renderer.clear(); renderer.render(after, camA); }
        if (sx < W) { renderer.setScissor(sx, 0, W - sx, H); renderer.clear(); renderer.render(before, camB); }
        renderer.setScissorTest(false);
        divider.style.transform = "translateX(" + sx + "px)";
        divider.style.opacity = sx > 0 && sx < W ? 1 : 0;
      }

      let ready = false;
      const build = Promise.all([
        document.fonts.load("700 100px 'HF Amiri'"), document.fonts.load("400 40px 'HF Cairo'"),
        document.fonts.load("700 40px 'HF Cairo'"), document.fonts.load("800 40px 'HF Cairo'"),
      ]).then(() => {
        paintCard(); paintBack(); paintPapers();
        renderer.initTexture && [cardTex, backTex].forEach((t) => (t.needsUpdate = true));
        paperMats.forEach((m) => (m.map.needsUpdate = true)); noteMat.map.needsUpdate = true;
        ready = true; renderAt(0);
        const gl = renderer.getContext(), px = new Uint8Array(4);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["stage"] = build;
      window.addEventListener("hf-seek", (e) => { if (ready && e && e.detail) renderAt(e.detail.time); });
      const proxy = { t: 0 }, tl = gsap.timeline({ paused: true });
      tl.fromTo(proxy, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => { if (ready) renderAt(proxy.t); } }, 0);
      window.__timelines["stage"] = tl;
    })();
  </script>
</template>
